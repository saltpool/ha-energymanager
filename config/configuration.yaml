# Energy Manager Configuration File
# === ENERGY_MANAGER_CORE_START v2.0.0 ===
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
modbus: !include_dir_merge_list modbus/
utility_meter: !include utility_meter.yaml
template: !include template.yaml
group: !include group.yaml

homeassistant:
  packages: !include_dir_named integrations
  customize:
    sensor.pv_energy_total:
      state_class: total_increasing
      device_class: energy

logger:
  default: warning
  logs:
    py.warnings: error
# === ENERGY_MANAGER_CORE_END ===

# ============================================================
# USER CONFIGURATION
# ============================================================
#
# Energy Manager manages the CORE section above.
# Do not modify settings inside the managed section, as
# they may be replaced during Energy Manager updates.
#
# For your own sensors, templates, groups, automations and
# other supported configuration, create a separate YAML
# package in /config/integrations/ with a user_ prefix.
#
# Example:
#   /config/integrations/user_custom.yaml
#
# Energy Manager updates do not modify user_*.yaml files.
#
# Home Assistant automations and scripts created through
# the UI remain in automations.yaml and scripts.yaml.
#
# Other top-level configuration can be added below.
# Do not duplicate existing top-level YAML keys.
# ============================================================
