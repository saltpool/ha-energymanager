timer:
  energy_control:
    name: Energy Control Timer
    restore: true

template:
- number:
  - name: battery_2a
    unique_id: em_yaml_battery_2a
    default_entity_id: number.battery_2a
    state: "{{ (states('input_number.battery_1') | float(0)) - 1 }}"
    min: -1
    max: 100
    step: 1
    set_value: []
    
  - name: battery_3a
    unique_id: em_yaml_battery_3a
    default_entity_id: number.battery_3a
    state: "{{ (states('input_number.battery_2') | float(0)) - 1 }}"
    min: -1
    max: 100
    step: 1
    set_value: []
    
  - name: battery_4a
    unique_id: em_yaml_battery_4a
    default_entity_id: number.battery_4a
    state: "{{ (states('input_number.battery_3') | float(0)) - 1 }}"
    min: -1
    max: 100
    step: 1
    set_value: []
    
  - name: battery_5a
    unique_id: em_yaml_battery_5a
    default_entity_id: number.battery_5a
    state: "{{ (states('input_number.battery_4') | float(0)) - 1 }}"
    min: -1
    max: 100
    step: 1
    set_value: []
    
  - name: battery_6a
    unique_id: em_yaml_battery_6a
    default_entity_id: number.battery_6a
    state: "{{ (states('input_number.battery_5') | float(0)) - 1 }}"
    min: -1
    max: 100
    step: 1
    set_value: []
    
  - name: battery_high_sell_mode_usable
    unique_id: em_yaml_battery_high_sell_mode_usable
    default_entity_id: number.battery_high_sell_mode_usable
    state: "{{ 100 - (states('input_number.high_sell_battery_reserve') | float(0)) }}"
    min: 0
    max: 100
    step: 1
    set_value: []
    
  sensor:
  - name: Grid Buy Price
    unique_id: em_yaml_grid_buy_price
    default_entity_id: sensor.grid_buy_price
    state: "{{ states('sensor.nodered_buyprice') | float(0) | round(5) }}"
    unit_of_measurement: "$/kWh"
    availability: "{{ has_value('sensor.nodered_buyprice') }}"
    
  - name: Grid Sell Price
    unique_id: em_yaml_grid_sell_price
    default_entity_id: sensor.grid_sell_price
    state: "{{ states('sensor.nodered_sellprice') | float(0) | round(5) }}"
    unit_of_measurement: "$/kWh"
    availability: "{{ has_value('sensor.nodered_sellprice') }}"
    
  - name: BOM Last Updated
    unique_id: em_yaml_bom_last_updated
    default_entity_id: sensor.bom_last_updated
    state: "{% set s = states.sensor.home_temp %}{{ as_timestamp(s.last_updated) | timestamp_custom('%B %-d, %Y at %-I:%M
      %p') if s is defined else 'Unavailable' }}"

# === ENERGY_MANAGER_UPDATE_INPUTS_END ===


