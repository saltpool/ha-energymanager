# === ENERGY_MANAGER_UI_START v1.3.0 ===

lovelace:
  dashboards:
    energy-costs:
      mode: yaml
      title: "Costs"
      icon: mdi:currency-usd
      show_in_sidebar: true
      filename: dashboards/energy_manager_costs.yaml
    energy-overview:
      mode: yaml
      title: "Energy Overview"
      icon: mdi:home-lightning-bolt
      show_in_sidebar: true
      filename: dashboards/energy_manager_overview.yaml
    energy-pv:
      mode: yaml
      title: "PV"
      icon: mdi:solar-power
      show_in_sidebar: true
      filename: dashboards/energy_manager_pv.yaml
    energy-ev:
      mode: yaml
      title: "EV"
      icon: mdi:car-electric
      show_in_sidebar: true
      filename: dashboards/energy_manager_ev.yaml
    grafana-energy:
      mode: yaml
      title: Grafana
      icon: mdi:chart-line
      show_in_sidebar: true
      filename: dashboards/grafana_energymanager.yaml

prometheus:
  requires_auth: false
  filter:
    include_entity_globs:
      - sensor.current_hourplus*
      - sensor.daily_*
      - sensor.day_*
      - sensor.electricity_*
      - sensor.forecast_*
      - sensor.grid_*
      - sensor.inverter_*
      - sensor.monthly_*
      - sensor.nodered_*
      - sensor.solcast_*
    include_entities:
      - sensor.demand_interval

recorder:
  exclude:
    entities:
      - automation.publish_inverter_data_to_mqtt
      - input_text.ev_reason_code
      - input_text.ev_reason_text
      - sensor.battery_calculation_engine
      - sensor.energy_manager_plan
      - sensor.energy_manager_motd
      - sensor.energy_manager_general
      - sensor.nodered_forecast
      - sensor.power_estimate_profile
    event_types:
      - automation_triggered
      - call_service
      - script_started
# === ENERGY_MANAGER_UI_END ===

